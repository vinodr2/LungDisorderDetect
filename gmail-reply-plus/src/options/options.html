<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gmail Reply+ — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="brand">
        <span class="logo">✉️</span>
        <div>
          <h1>Gmail Reply+</h1>
          <p class="tagline">Outlook-style replies for Gmail — everything runs locally.</p>
        </div>
      </div>
    </header>

    <main id="settings" class="settings"></main>

    <footer class="foot">
      <span id="status" class="status" role="status"></span>
      <button id="reset" class="btn-text">Reset to defaults</button>
    </footer>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
